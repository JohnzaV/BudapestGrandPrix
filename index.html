<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budapest Grand Prix — kartičky</title>
<meta name="theme-color" content="#5E1A20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   Vizuální systém: emailová cedule budapešťského metra.
   Každý balíček = jedna linka metra ve skutečných barvách BKK.
   Světlý podklad schválně — hraje se venku v červencovém slunci.
   ───────────────────────────────────────────────────────────── */
:root{
  --ink:#17181C;
  --ink-soft:#5A5D63;
  --paper:#E3E2D8;
  --card:#FBFAF6;
  --rule:#C3C2B6;
  --oxblood:#5E1A20;
  --m1:#F2B705;  /* Kérdés  — otázky */
  --m2:#C8353B;  /* Átok    — prokletí */
  --m3:#0B62A8;  /* Feladat — úkoly */
  --m4:#00915A;  /* Szobor  — sošky */
  --disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 90px}

/* hlavička */
header{background:var(--oxblood);color:#F4E9D8;margin:0 -14px 0;padding:14px 16px 12px}
header .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.72}
header h1{font-family:var(--disp);font-weight:700;font-size:34px;line-height:.95;letter-spacing:-.01em;margin:4px 0 0;text-transform:uppercase}
header .sub{font-size:12px;opacity:.75;margin-top:5px}

/* výběr balíčku — pruhy linek metra */
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:0 -14px 18px;border-bottom:3px solid var(--ink)}
nav button{
  appearance:none;border:0;border-right:1px solid rgba(0,0,0,.25);cursor:pointer;
  padding:11px 4px 9px;background:#B9B8AE;color:rgba(0,0,0,.55);
  font-family:var(--disp);font-weight:700;font-size:19px;line-height:1;text-transform:uppercase;
  transition:background .12s,color .12s;
}
nav button:last-child{border-right:0}
nav button small{display:block;font-family:var(--body);font-weight:600;font-size:9.5px;letter-spacing:.06em;margin-top:4px;opacity:.8}
nav button[aria-selected="true"]{color:#111}
nav button[data-deck="q"][aria-selected="true"]{background:var(--m1)}
nav button[data-deck="c"][aria-selected="true"]{background:var(--m2);color:#fff}
nav button[data-deck="b"][aria-selected="true"]{background:var(--m3);color:#fff}
nav button[data-deck="s"][aria-selected="true"]{background:var(--m4);color:#fff}
nav button:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}

/* karta */
.card{
  background:var(--card);border:2px solid var(--ink);position:relative;
  box-shadow:5px 5px 0 rgba(23,24,28,.16);min-height:210px;display:flex;flex-direction:column;
}
.card .bar{
  background:var(--accent,#999);color:#111;padding:7px 12px 6px;display:flex;
  justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);
  font-family:var(--disp);font-weight:700;text-transform:uppercase;
}
.card .bar .name{font-size:21px;line-height:1;letter-spacing:.02em}
.card .bar .name span{font-family:var(--body);font-weight:600;font-size:10px;letter-spacing:.08em;opacity:.7;display:block;margin-top:2px}
.card .bar .id{font-family:var(--mono);font-size:13px;font-weight:400}
.card .body{padding:20px 18px;flex:1;display:flex;flex-direction:column;justify-content:center}
.card .text{font-size:21px;line-height:1.32;font-weight:500}
.card .text em{font-style:normal;background:linear-gradient(transparent 62%,rgba(242,183,5,.55) 62%)}
.card .meta{margin-top:16px;padding-top:11px;border-top:1px dashed var(--rule);display:flex;gap:10px;
  justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.card .pts{background:var(--ink);color:var(--card);padding:3px 8px;font-weight:700;letter-spacing:.04em}
.card.empty .body{color:var(--ink-soft);justify-content:center;text-align:center}
.card.drawn{animation:stamp .18s cubic-bezier(.2,.9,.3,1.4)}
@keyframes stamp{from{transform:scale(.965) rotate(-.4deg);opacity:.4}to{transform:none;opacity:1}}

/* ovládání */
.draw{
  width:100%;margin-top:14px;padding:17px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);
  font-family:var(--disp);font-weight:700;font-size:25px;text-transform:uppercase;letter-spacing:.06em;
  cursor:pointer;box-shadow:5px 5px 0 rgba(23,24,28,.16);
}
.draw:active{transform:translate(3px,3px);box-shadow:2px 2px 0 rgba(23,24,28,.16)}
.draw:disabled{background:#B9B8AE;border-color:#8E8D84;color:#6A695F;box-shadow:none;cursor:default}
.draw:focus-visible{outline:3px solid var(--m2);outline-offset:3px}
.row{display:flex;gap:9px;align-items:center;margin-top:11px;flex-wrap:wrap}
.counter{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink-soft);flex:1;min-width:120px}
.ghost{
  appearance:none;background:transparent;border:1.5px solid var(--ink);color:var(--ink);
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  padding:7px 11px;cursor:pointer;
}
.ghost:hover{background:var(--ink);color:var(--paper)}
.ghost:focus-visible{outline:2px solid var(--m2);outline-offset:2px}

/* filtry kategorií */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.chip{
  appearance:none;border:1.5px solid var(--rule);background:transparent;color:var(--ink-soft);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:6px 9px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:focus-visible{outline:2px solid var(--m2);outline-offset:2px}

/* sekce */
h2{font-family:var(--disp);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.16em;
  margin:30px 0 9px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{padding:7px 0;border-bottom:1px solid var(--rule);display:flex;gap:9px}
.hist li b{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-soft);flex:0 0 42px;padding-top:2px}
.hist .none{color:var(--ink-soft);font-style:italic;border:0}

/* checklist sošek */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.list .nm{flex:1;font-size:15px;line-height:1.25}
.list .nm i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.list .p{font-family:var(--mono);font-size:12px;color:var(--ink-soft);flex:0 0 30px;text-align:right}
.claim{display:flex;gap:4px;flex:0 0 auto}
.claim button{
  width:32px;height:32px;border:1.5px solid var(--rule);background:transparent;
  font-family:var(--disp);font-weight:700;font-size:16px;cursor:pointer;color:var(--ink-soft);
}
.claim button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.claim button:focus-visible{outline:2px solid var(--m2);outline-offset:2px}
li.taken .nm{opacity:.45;text-decoration:line-through}

/* synchronizace */
.sync{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;color:var(--ink-soft);flex:1;min-width:150px}
.sync::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--rule);flex:0 0 9px}
.sync.ok::before{background:var(--m4)}
.sync.err::before{background:var(--m2)}
.me{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.me button{width:28px;height:28px;border:1.5px solid var(--rule);background:transparent;
  font-family:var(--disp);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink-soft)}
.me button[aria-pressed="true"]{background:var(--oxblood);border-color:var(--oxblood);color:#F4E9D8}
.me button:focus-visible{outline:2px solid var(--m2);outline-offset:2px}
.feed{list-style:none;margin:0;padding:0;font-size:13.5px}
.feed li{padding:8px 0;border-bottom:1px solid var(--rule);display:flex;gap:9px;align-items:flex-start}
.feed .who{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.1;flex:0 0 20px;
  text-align:center;border:1.5px solid var(--ink);padding:1px 0}
.feed .when{font-family:var(--mono);font-size:10px;color:var(--ink-soft);flex:0 0 42px;padding-top:3px}
.feed .none{color:var(--ink-soft);font-style:italic;border:0}

/* skóre */
.score{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);
  display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.score div{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:9px 6px}
.score div+div{border-left:1px solid rgba(255,255,255,.22)}
.score .lbl{font-family:var(--disp);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.08em}
.score .val{font-family:var(--mono);font-size:20px;font-weight:700;min-width:44px;text-align:center}
.score button{width:30px;height:30px;border:1px solid rgba(255,255,255,.45);background:transparent;
  color:var(--paper);font-size:17px;line-height:1;cursor:pointer;font-family:var(--mono)}
.score button:focus-visible{outline:2px solid var(--m1);outline-offset:2px}
.note{font-size:12.5px;color:var(--ink-soft);margin-top:9px;line-height:1.5}
.hidden{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* tisk: všechny karty na papír k rozstříhání */
@media print{
  header,nav,.draw,.row,.chips,.score,.note,#hist-sec,#feed-sec,#app,#statues{display:none!important}
  body{background:#fff;font-size:11px}
  .wrap{max-width:none;padding:0}
  #print{display:block!important}
  .sheet{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .pc{border:1px dashed #999;padding:9px;min-height:150px;page-break-inside:avoid}
  .pc .h{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:12px;
    border-bottom:1px solid #000;padding-bottom:3px;margin-bottom:7px;display:flex;justify-content:space-between}
  .pc .t{font-size:13px;line-height:1.3}
  .pc .m{margin-top:7px;font-family:var(--mono);font-size:9px;color:#555}
}
#print{display:none}
</style>
</head>
<body>

<div class="wrap">
<header>
  <div class="kicker">Kolo · kártyagenerátor</div>
  <h1>Budapest<br>Grand Prix</h1>
  <div class="sub">Čtyři balíčky, čtyři linky metra. Karta se nevrací, dokud nezamícháš.</div>
</header>

<nav role="tablist" aria-label="Balíčky">
  <button data-deck="q" role="tab" aria-selected="true">Kérdés<small>OTÁZKY</small></button>
  <button data-deck="c" role="tab" aria-selected="false">Átok<small>PROKLETÍ</small></button>
  <button data-deck="b" role="tab" aria-selected="false">Feladat<small>ÚKOLY</small></button>
  <button data-deck="s" role="tab" aria-selected="false">Szobor<small>SOŠKY</small></button>
</nav>

<div id="app">
  <div class="card empty" id="card">
    <div class="bar"><div class="name">—</div><div class="id"></div></div>
    <div class="body"><div class="text">Vyber balíček a táhni.</div></div>
  </div>

  <button class="draw" id="drawBtn">Húz — táhnout</button>

  <div class="row">
    <div class="counter" id="counter"></div>
    <button class="ghost" id="shuffleBtn">Zamíchat</button>
    <button class="ghost" id="anyBtn">Cokoliv</button>
  </div>

  <div class="row">
    <span class="sync" id="sync">jen tento telefon</span>
    <span class="me">Jsem
      <button data-me="a" aria-pressed="false">A</button>
      <button data-me="b" aria-pressed="false">B</button>
    </span>
  </div>

  <div class="chips" id="chips"></div>

  <section id="feed-sec" class="hidden">
    <h2>Co dělá druhý tým</h2>
    <ul class="feed" id="feed"></ul>
  </section>

  <section id="hist-sec">
    <h2>Poslední tažené</h2>
    <ul class="hist" id="hist"><li class="none">Zatím nic.</li></ul>
  </section>
</div>

<div id="statues" class="hidden">
  <h2>Kolodko — 29 sošek</h2>
  <div class="counter" id="stProgress" style="margin-bottom:8px"></div>
  <ul class="list" id="stList"></ul>
</div>

<p class="note" id="note"></p>
</div>

<div class="score">
  <div><span class="lbl">Tým A</span><button data-t="a" data-d="-1" aria-label="Ubrat A">−</button><span class="val" id="sa">0</span><button data-t="a" data-d="1" aria-label="Přidat A">+</button></div>
  <div><span class="lbl">Tým B</span><button data-t="b" data-d="-1" aria-label="Ubrat B">−</button><span class="val" id="sb">0</span><button data-t="b" data-d="1" aria-label="Přidat B">+</button></div>
</div>

<div id="print"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   1) SYNCHRONIZACE — jediné, co je potřeba vyplnit
   Prázdné url = appka běží jen na tomhle telefonu.
   Vyplněné    = skóre, sošky a feed se sdílí mezi všemi.
   Adresu získáš ve Firebase → Build → Realtime Database.
   Bez lomítka na konci!
   ═══════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════
   3) LOGIKA — tady už není potřeba nic měnit
   ═══════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let S={deck:'q',used:{q:[],c:[],b:[],s:[]},hist:[],filt:[],claim:{},a:0,b:0,me:''};
let feed=[], net=null, dirty=0;

/* lokální stav v adrese stránky — refresh ho nesmaže */
function save(){try{history.replaceState(null,'','#'+encodeURIComponent(JSON.stringify(S)))}catch(e){}}
function load(){try{const h=location.hash.slice(1);if(h)S=Object.assign(S,JSON.parse(decodeURIComponent(h)))}catch(e){}}

/* sdílený stav přes Firebase Realtime Database (REST, bez SDK) */
const live=()=>!!SYNC.url, base=()=>`${SYNC.url}/rooms/${SYNC.room}`;
async function send(path,method,val){
  if(!live())return;
  dirty=Date.now();
  try{
    await fetch(`${base()}/${path}.json`,{method,body:val===undefined?undefined:JSON.stringify(val)});
    net=true;
  }catch(e){net=false}
}
const put=(p,v)=>send(p,'PUT',v);
const drop=p=>send(p,'DELETE');
const log=txt=>{if(S.me)send('feed','POST',{t:Date.now(),w:S.me,x:txt})};

async function pull(){
  if(!live())return;
  try{
    const r=await fetch(`${base()}.json`,{cache:'no-store'});
    const d=await r.json()||{};
    net=true;
    if(Date.now()-dirty>2000){          // nepřepisuj to, co jsem právě klikl
      S.a=(d.score&&d.score.a)||0;
      S.b=(d.score&&d.score.b)||0;
      S.claim=d.claim||{};
    }
    feed=Object.values(d.feed||{}).sort((x,y)=>y.t-x.t).slice(0,12);
    update();
  }catch(e){net=false;update()}
}

const cats=d=>[...new Set(DECKS[d].cards.map(c=>c.k))];
const cid=(d,i)=>`${DECKS[d].pre}-${String(i+1).padStart(2,'0')}`;
const pool=d=>DECKS[d].cards.map((c,i)=>i)
  .filter(i=>!S.used[d].includes(i))
  .filter(i=>d!=='q'||!S.filt.length||S.filt.includes(DECKS[d].cards[i].k));

function renderCard(d,i){
  const c=DECKS[d].cards[i], D=DECKS[d], el=$('#card');
  el.className='card drawn'; el.style.setProperty('--accent',D.color);
  const bar=el.querySelector('.bar');
  bar.style.color = d==='q' ? '#111' : '#fff';
  bar.innerHTML=`<div class="name">${D.name}<span>${D.cs}</span></div><div class="id">${cid(d,i)}</div>`;
  el.querySelector('.body').innerHTML=
    `<div class="text">${c.t}</div><div class="meta"><span>${c.k}</span>${
      c.n?`<span>${c.n}</span>`:''}${c.p!==undefined?`<span class="pts">${c.p} P</span>`:''}</div>`;
  setTimeout(()=>el.classList.remove('drawn'),200);
}

function draw(d){
  const p=pool(d); if(!p.length)return;
  const i=p[Math.floor(Math.random()*p.length)];
  S.used[d].push(i);
  S.hist.unshift({d,i}); S.hist=S.hist.slice(0,8);
  log(`${DECKS[d].name} ${cid(d,i)} — ${DECKS[d].cards[i].t.replace(/<[^>]+>/g,'')}`);
  renderCard(d,i); update();
}

function renderStatues(){
  const cs=DECKS.s.cards, done=Object.keys(S.claim).length;
  $('#stProgress').textContent=`nalezeno ${done} z ${cs.length} · ${
    cs.reduce((a,c,i)=>a+(S.claim[i]?c.p:0),0)} P rozděleno`;
  $('#stList').innerHTML=cs.map((c,i)=>`<li class="${S.claim[i]?'taken':''}">
    <div class="nm">${c.t}<i>${c.k}</i></div><div class="p">${c.p} P</div>
    <div class="claim">
      <button data-i="${i}" data-t="a" aria-pressed="${S.claim[i]==='a'}" aria-label="Tým A">A</button>
      <button data-i="${i}" data-t="b" aria-pressed="${S.claim[i]==='b'}" aria-label="Tým B">B</button>
    </div></li>`).join('');
}

function update(){
  const d=S.deck, D=DECKS[d], isS=d==='s';
  $$('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.deck===d));
  $('#app').classList.toggle('hidden',isS);
  $('#statues').classList.toggle('hidden',!isS);

  if(isS){ renderStatues() }
  else{
    const left=pool(d).length;
    $('#counter').textContent=`zbývá ${left} z ${D.cards.length}`;
    $('#drawBtn').disabled=!left;
    $('#drawBtn').textContent=left?'Húz — táhnout':'Balíček je prázdný';
    $('#chips').innerHTML = d==='q'
      ? cats('q').map(k=>`<button class="chip" data-k="${k}" aria-pressed="${S.filt.includes(k)}">${k}</button>`).join('')
      : '';
    $('#hist').innerHTML = S.hist.length
      ? S.hist.map(h=>`<li><b>${cid(h.d,h.i)}</b><span>${
          DECKS[h.d].cards[h.i].t.replace(/<[^>]+>/g,'')}</span></li>`).join('')
      : '<li class="none">Zatím nic.</li>';

    const sy=$('#sync');
    sy.className='sync'+(live()?(net===false?' err':net?' ok':''):'');
    sy.textContent=!live()?'jen tento telefon'
      :net===false?'spojení vypadlo'
      :net?`sdíleno · ${SYNC.room}`:'připojuji…';
    $$('.me button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.me===S.me));
    $('#feed-sec').classList.toggle('hidden',!live());
    if(live()){
      $('#feed').innerHTML = feed.length
        ? feed.map(f=>`<li><span class="who">${(f.w||'?').toUpperCase()}</span>
            <span class="when">${new Date(f.t).toTimeString().slice(0,5)}</span>
            <span>${f.x}</span></li>`).join('')
        : '<li class="none">Zatím ticho.</li>';
    }
  }

  $('#sa').textContent=S.a; $('#sb').textContent=S.b;
  $('#note').textContent = isS
    ? 'Klepnutím na A nebo B přiřadíš sošku týmu a body se připíšou do skóre.'
    : live()
      ? 'Skóre, sošky a feed jsou společné pro všechny telefony. Balíček má každý svůj — táhnutá karta zmizí jen tobě.'
      : 'Běží jen lokálně. Stav drží adresa v prohlížeči, refresh ho nesmaže. Sdílení se zapíná v SYNC nahoře v kódu.';
  save();
}

/* události */
$$('nav button').forEach(b=>b.onclick=()=>{S.deck=b.dataset.deck;update()});
$('#drawBtn').onclick=()=>draw(S.deck);
$('#shuffleBtn').onclick=()=>{
  if(S.deck==='s'){
    if(confirm('Vynulovat všechny sošky a jejich body?')){
      Object.keys(S.claim).forEach(i=>{const t=S.claim[i];S[t]-=DECKS.s.cards[i].p});
      S.claim={}; drop('claim'); put('score/a',S.a); put('score/b',S.b);
    }
  } else S.used[S.deck]=[];
  update();
};
$('#anyBtn').onclick=()=>{
  const ds=['q','c','b'].filter(d=>pool(d).length); if(!ds.length)return;
  S.deck=ds[Math.floor(Math.random()*ds.length)]; draw(S.deck);
};
$('#chips').onclick=e=>{
  const b=e.target.closest('.chip'); if(!b)return;
  const k=b.dataset.k;
  S.filt=S.filt.includes(k)?S.filt.filter(x=>x!==k):[...S.filt,k];
  update();
};
$('#stList').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  const i=b.dataset.i, t=b.dataset.t, p=DECKS.s.cards[i].p, prev=S.claim[i];
  if(prev)S[prev]-=p;
  if(prev===t){ delete S.claim[i]; drop(`claim/${i}`) }
  else{ S.claim[i]=t; S[t]+=p; put(`claim/${i}`,t); log(`našel sošku ${DECKS.s.cards[i].t} (+${p} P)`) }
  if(prev)put(`score/${prev}`,S[prev]);
  put(`score/${t}`,S[t]);
  update();
};
$$('.score button').forEach(b=>b.onclick=()=>{
  const t=b.dataset.t; S[t]+=+b.dataset.d; put(`score/${t}`,S[t]); update();
});
$$('.me button').forEach(b=>b.onclick=()=>{S.me=S.me===b.dataset.me?'':b.dataset.me;update()});

/* tiskový arch */
$('#print').innerHTML=Object.entries(DECKS).map(([d,D])=>
  `<div class="sheet">${D.cards.map((c,i)=>`<div class="pc">
    <div class="h"><span>${D.name}</span><span>${cid(d,i)}</span></div>
    <div class="t">${c.t}</div>
    <div class="m">${c.k}${c.p!==undefined?' · '+c.p+' P':''}</div></div>`).join('')}</div>`).join('');

/* start */
load(); update();
if(live()){
  pull();
  setInterval(pull,3000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
}
</script>
</body>
